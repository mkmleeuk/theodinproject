<!DOCTYPE <html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>HTML Lists</title>
  </head>

  <body>
    <h1>This is an unordered list</h1>
    <p>
      Unordered lists are a list without numbers just bullet points. They are
      not ordered sequentially
    </p>
    <ul>
      <li>First item</li>
      <li>Second item</li>
    </ul>

    <h1>This is an ordered list</h1>
    <p>Ordered lists are sequential and are numbered</p>
    <ol>
      <li>First item</li>
      <li>Second item</li>
    </ol>
  </body>
</html>
