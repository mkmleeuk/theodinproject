<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=name, initial-scale=1.0" />
    <title>Links</title>
  </head>
  <body>
    <h1>Practicing Links</h1>
    <h3>Link to URL</h3>
    <p>This link goes to a URL</p>
    <p><a href="https://www.google.com">Link to Google</a></p>

    <h3>This link goes to another page</h3>
    <p><a href="lists.html">Go to lists page</a></p>

    <h3>Link that opens a new tab</h3>
    <p>
      <!-- _blank creates a new tab default is _self which will update in current tab -->
      <!--  -->
      <a href="https://youtube.com" target="_blank" rel="noreferrer"
        >Youtube Link
      </a>
    </p>
    <!-- when clicking the link for the video it only downloads the video does not playback -->
    <img src="PCHR0953.jpg" alt="Christina" width="500" height="650" />
    <video height="600" width="400" controls>
      <source src="landingpage.mp4" type="video/mp4" />
    </video>
    <video height="600" width="400" autoplay loop muted>
      <source src="landingpage.mp4" type="video/mp4" />
    </video>
  </body>
</html>
